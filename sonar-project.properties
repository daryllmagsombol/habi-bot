# Self-hosted SonarQube project settings.
# SONAR_HOST_URL and SONAR_PROJECT_KEY are supplied by the workflow from
# repository variables. Never commit host-specific IDs, tokens, or certificates.
sonar.projectName=Habi
sonar.sourceEncoding=UTF-8

# Application and automation source.
sonar.sources=apps/web/app,apps/backend/src,packages/contracts/src,packages/config/eslint,scripts

# Application and package test roots. All script test files are excluded below.
sonar.tests=apps/backend/test,apps/web/test,packages/config/test,packages/contracts/test

# Standalone analyzer-only config; no workspace extends or @types dependencies.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json

# Generated, vendor, documentation, and non-product files are not analyzed.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.turbo/**,**/coverage/**,**/next-env.d.ts,**/*.tsbuildinfo,scripts/**/*.test.mjs,docs/**,**/*.md,**/.env*,**/.serena/**
