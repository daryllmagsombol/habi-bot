name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify foundation
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm must be on PATH before setup-node configures pnpm store caching.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # verify:foundation performs the frozen install, forced build, typecheck,
      # lint, forced tests, and Turbo graph checks. No provider or Sonar secrets.
      - name: Verify foundation
        run: pnpm verify:foundation

      - name: Test review helpers
        run: node --test .github/scripts/review.test.mjs .github/scripts/review-container.test.mjs .github/scripts/review-network.test.mjs .github/scripts/review-batches.test.mjs .github/scripts/review-markdown.test.mjs

      - name: Test SonarQube workflow checks
        run: node --test scripts/ci/sonarqube.test.mjs
