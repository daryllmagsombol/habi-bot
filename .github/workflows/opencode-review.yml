name: OpenCode review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare trusted input
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      trusted_source_sha: ${{ steps.source.outputs.source_sha }}
      bootstrap: ${{ steps.source.outputs.bootstrap }}
      batches: ${{ steps.batches.outputs.batches }}
      batch_count: ${{ steps.batches.outputs.count }}
    steps:
      - name: Check review eligibility
        id: gate
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::notice::OpenCode review skipped: fork pull requests are not reviewed."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted base
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Verify event base checkout
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          actual_base="$(git -C "$GITHUB_WORKSPACE/base" rev-parse HEAD)"
          if [ "$actual_base" != "$BASE_SHA" ]; then
            echo "::error::Trusted base checkout does not match the event base SHA."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0

      - name: Select trusted review source
        id: source
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BOOTSTRAP_SHA: ${{ vars.OPENCODE_REVIEW_BOOTSTRAP_SHA }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            console.error('::error::GITHUB_OUTPUT is unavailable.');
            process.exit(1);
          }

          const assets = [
            '.github/review/system.md',
            '.github/review/security.md',
            '.github/review/bugs.md',
            '.github/scripts/review-lib.mjs',
            '.github/scripts/review-markdown.mjs',
            '.github/scripts/review-prepare.mjs',
            '.github/scripts/review-model.mjs',
            '.github/scripts/review-publish.mjs',
            '.github/scripts/review-container.mjs',
            '.github/scripts/review-container-entry.mjs',
            '.github/scripts/review-network.mjs',
            '.github/scripts/review-batches.mjs',
          ];
          const workspace = process.env.WORKSPACE ?? '';
          const baseSha = process.env.BASE_SHA ?? '';
          const bootstrapSha = process.env.BOOTSTRAP_SHA ?? '';
          const write = (values) => {
            fs.appendFileSync(
              outputPath,
              Object.entries(values)
                .map(([key, value]) => `${key}=${value}`)
                .join('\n') + '\n',
            );
          };
          const usable = (root) =>
            assets.every((relative) => {
              try {
                const stat = fs.statSync(path.join(root, relative));
                return stat.isFile() && stat.size > 0;
              } catch {
                return false;
              }
            });

          if (usable(path.join(workspace, 'base'))) {
            write({ ready: 'true', bootstrap: 'false', source: 'base', source_sha: baseSha });
            console.log('opencode-review: trusted source base');
            process.exit(0);
          }

          if (bootstrapSha.length === 0) {
            write({ ready: 'false', bootstrap: 'false', source: 'missing', source_sha: '' });
            console.log(
              '::notice::OpenCode review skipped: trusted base assets are missing and OPENCODE_REVIEW_BOOTSTRAP_SHA is not configured.',
            );
            process.exit(0);
          }

          if (!/^[0-9a-f]{40}$/.test(bootstrapSha)) {
            console.error(
              '::error::OPENCODE_REVIEW_BOOTSTRAP_SHA must be an exact 40-character lowercase commit SHA.',
            );
            process.exit(1);
          }

          write({ ready: 'true', bootstrap: 'true', source: 'trusted', source_sha: bootstrapSha });
          console.log(`opencode-review: trusted source bootstrap ${bootstrapSha.slice(0, 12)}...`);
          NODE

      - name: Check out approved bootstrap source
        if: steps.source.outputs.bootstrap == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: trusted
          persist-credentials: false

      - name: Verify selected trusted source
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE: ${{ steps.source.outputs.source }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/$SOURCE"
          actual_source="$(git -C "$root" rev-parse HEAD)"
          if [ "$actual_source" != "$SOURCE_SHA" ]; then
            echo "::error::Trusted review source checkout does not match the selected immutable SHA."
            exit 1
          fi
          if [ "$SOURCE" = "base" ] && [ "$SOURCE_SHA" != "$BASE_SHA" ]; then
            echo "::error::Base source SHA does not match the event base SHA."
            exit 1
          fi
          missing=0
          for rel in \
            .github/scripts/review-lib.mjs \
            .github/scripts/review-markdown.mjs \
            .github/scripts/review-prepare.mjs \
            .github/scripts/review-model.mjs \
            .github/scripts/review-publish.mjs \
            .github/scripts/review-container.mjs \
            .github/scripts/review-container-entry.mjs \
            .github/scripts/review-network.mjs \
            .github/scripts/review-batches.mjs \
            .github/review/system.md \
            .github/review/security.md \
            .github/review/bugs.md; do
            if [ ! -f "$root/$rel" ] || [ ! -s "$root/$rel" ]; then
              echo "::error::Missing or empty trusted review asset: $rel"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Trusted review source is incomplete; refusing to execute partial review assets."
            exit 1
          fi

      - name: Build bounded review input
        if: steps.source.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_BASE_ROOT: ${{ github.workspace }}/${{ steps.source.outputs.source }}
          REVIEW_TRUSTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REVIEW_BOOTSTRAP: ${{ steps.source.outputs.bootstrap }}
          REVIEW_OUTPUT_DIR: ${{ runner.temp }}/review-input
        run: node "$REVIEW_BASE_ROOT/.github/scripts/review-prepare.mjs"

      - name: Record trusted source metadata
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BOOTSTRAP: ${{ steps.source.outputs.bootstrap }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/review-input
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const outputDir = process.env.OUTPUT_DIR;
          fs.mkdirSync(outputDir, { recursive: true });
          fs.writeFileSync(
            path.join(outputDir, 'trusted-source.json'),
            JSON.stringify(
              {
                sha: process.env.SOURCE_SHA,
                bootstrap: process.env.BOOTSTRAP === 'true',
                eventBaseSha: process.env.EVENT_BASE_SHA,
                eventHeadSha: process.env.EVENT_HEAD_SHA,
              },
              null,
              2,
            ) + '\n',
          );
          NODE

      - name: Build batch matrix
        id: batches
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          MATRIX_PATH: ${{ runner.temp }}/review-input/matrix.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');

          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            console.error('::error::GITHUB_OUTPUT is unavailable.');
            process.exit(1);
          }
          let matrix;
          try {
            matrix = JSON.parse(fs.readFileSync(process.env.MATRIX_PATH, 'utf8'));
          } catch {
            console.error('::error::Trusted batch matrix is missing or invalid.');
            process.exit(1);
          }
          if (!matrix || !Array.isArray(matrix.batchIds) || !Number.isInteger(matrix.count)) {
            console.error('::error::Trusted batch matrix does not have the expected shape.');
            process.exit(1);
          }
          if (matrix.count !== matrix.batchIds.length) {
            console.error('::error::Trusted batch matrix count does not match its batch IDs.');
            process.exit(1);
          }
          if (matrix.count > 256) {
            console.error('::error::Batch matrix exceeds the 256-job GitHub matrix limit; refusing to truncate.');
            process.exit(1);
          }
          const ids = matrix.batchIds;
          if (!ids.every((id) => typeof id === 'string' && /^b[0-9]{4}$/.test(id))) {
            console.error('::error::Batch matrix contains an invalid generated batch ID.');
            process.exit(1);
          }
          if (new Set(ids).size !== ids.length) {
            console.error('::error::Batch matrix contains duplicate generated batch IDs.');
            process.exit(1);
          }
          fs.appendFileSync(outputPath, `batches=${JSON.stringify(ids)}\ncount=${ids.length}\n`);
          console.log(`opencode-review: ${ids.length} batch(es) prepared`);
          NODE

      - name: Upload trusted review input
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/review-input
          if-no-files-found: error
          retention-days: 3

  review:
    name: Run OpenCode review
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.batch_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same-run artifact access uses the Actions runtime token, not a job token.
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.batches) }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0

      - name: Download trusted review input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/review-input

      - name: Verify container isolation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::The contained review runtime requires Linux."
            exit 1
          fi
          for tool in docker iptables sudo; do
            if ! command -v "$tool" > /dev/null 2>&1; then
              echo "::error::Missing required isolation tool: $tool"
              exit 1
            fi
          done
          if ! docker info > /dev/null 2>&1; then
            echo "::error::The Docker daemon is unavailable to the review job."
            exit 1
          fi
          if ! sudo -n true > /dev/null 2>&1; then
            echo "::error::Passwordless sudo is required for the iptables isolation policy."
            exit 1
          fi

      - name: Download and verify OpenCode CLI
        env:
          OPENCODE_URL: https://github.com/anomalyco/opencode/releases/download/v1.19.3/opencode-linux-x64.tar.gz
          OPENCODE_SHA256: 13a8fb2978302071b86f9d7e00da9c8895f9cd846978379c3bdc6a5333536c9b
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          bin="$RUNNER_TEMP/opencode-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --output "$archive" "$OPENCODE_URL"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum --check --strict -
          members="$(tar -tzf "$archive")"
          if [ "$members" != "opencode" ]; then
            echo "::error::Unexpected OpenCode archive layout."
            exit 1
          fi
          mkdir -p "$bin"
          tar -xzf "$archive" -C "$bin"
          test -x "$bin/opencode"

      - name: Run OpenCode review
        env:
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          batch="${{ matrix.batch }}"
          if [[ ! "$batch" =~ ^b[0-9]{4}$ ]]; then
            echo "::error::Unsafe generated batch ID: $batch"
            exit 1
          fi
          node "$RUNNER_TEMP/review-input/trusted/review-model.mjs" \
            --manifest "$RUNNER_TEMP/review-input/manifest.json" \
            --batch "$batch" \
            --input "$RUNNER_TEMP/review-input/batches/$batch/input.json" \
            --prompt "$RUNNER_TEMP/review-input/batches/$batch/prompt.txt" \
            --cli "$RUNNER_TEMP/opencode-bin/opencode" \
            --outcome "$RUNNER_TEMP/review-outcome/$batch.json"

      - name: Verify outcome identity
        if: always()
        shell: bash
        env:
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_BATCH: ${{ matrix.batch }}
          OUTCOME_PATH: ${{ runner.temp }}/review-outcome/${{ matrix.batch }}.json
        run: |
          set -euo pipefail
          if [ ! -f "$OUTCOME_PATH" ]; then
            exit 0
          fi
          node - <<'NODE'
          const fs = require('node:fs');

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };
          const repo = process.env.REVIEW_REPO ?? '';
          const pr = Number(process.env.REVIEW_PR);
          const baseSha = process.env.REVIEW_BASE_SHA ?? '';
          const headSha = process.env.REVIEW_HEAD_SHA ?? '';
          const batch = process.env.REVIEW_BATCH ?? '';
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)) fail('Reviewed repository is invalid.');
          if (!Number.isInteger(pr) || pr < 1) fail('Reviewed PR number is invalid.');
          if (!/^[0-9a-f]{40}$/.test(baseSha)) fail('Reviewed base SHA is not an exact commit SHA.');
          if (!/^[0-9a-f]{40}$/.test(headSha)) fail('Reviewed head SHA is not an exact commit SHA.');
          if (!/^b[0-9]{4}$/.test(batch)) fail('Reviewed batch ID is invalid.');

          let outcome;
          try {
            outcome = JSON.parse(fs.readFileSync(process.env.OUTCOME_PATH, 'utf8'));
          } catch {
            fail('Outcome is not valid JSON.');
          }
          if (!outcome || typeof outcome !== 'object' || Array.isArray(outcome)) fail('Outcome is not an object.');
          if (
            outcome.version !== 1 ||
            String(outcome.repo).toLowerCase() !== repo.toLowerCase() ||
            Number(outcome.pr) !== pr ||
            String(outcome.baseSha).toLowerCase() !== baseSha ||
            String(outcome.headSha).toLowerCase() !== headSha ||
            outcome.batchId !== batch
          ) {
            fail('Outcome identity does not match the workflow event.');
          }
          // Attribution stays in trusted outcome metadata and the report header;
          // the model review body is never modified here.
          NODE

      - name: Upload bounded review outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-outcome-${{ matrix.batch }}
          path: ${{ runner.temp }}/review-outcome/${{ matrix.batch }}.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    name: Publish review comment
    needs: [prepare, review]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.ready == 'true' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the PR comment API and this run's artifact listing are needed;
    # artifact downloads use the Actions runtime token.
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0

      - name: Download trusted review input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/review-input

      # The trusted listing is the authority for which outcome artifacts exist.
      # It is stored outside the download directory so downloads cannot replace it.
      - name: List review outcome artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          ARTIFACT_METADATA_PATH: ${{ runner.temp }}/review-artifacts/artifacts.json
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          async function main() {
            const apiUrl = (process.env.GITHUB_API_URL ?? 'https://api.github.com').replace(/\/+$/, '');
            const repo = process.env.REVIEW_REPO ?? '';
            const runId = process.env.REVIEW_RUN_ID ?? '';
            const token = process.env.GITHUB_TOKEN ?? '';
            const outputPath = process.env.ARTIFACT_METADATA_PATH ?? '';
            if (
              !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo) ||
              !/^[0-9]+$/.test(runId) ||
              token.length === 0 ||
              outputPath.length === 0
            ) {
              console.error('::error::Artifact listing context is incomplete.');
              process.exit(1);
            }

            const repoPath = repo.split('/').map(encodeURIComponent).join('/');
            const maxPages = 3;
            const maxArtifacts = 288;
            const artifacts = [];
            let totalCount = null;
            for (let page = 1; page <= maxPages; page += 1) {
              let response;
              try {
                response = await fetch(
                  `${apiUrl}/repos/${repoPath}/actions/runs/${runId}/artifacts?per_page=100&page=${page}`,
                  {
                    headers: {
                      Accept: 'application/vnd.github+json',
                      Authorization: `Bearer ${token}`,
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'habi-opencode-review',
                    },
                  },
                );
              } catch {
                console.error('::error::Could not list review artifacts.');
                process.exit(1);
              }
              if (!response || !response.ok) {
                console.error(`::error::Artifact listing failed with HTTP ${response ? response.status : 'unknown'}.`);
                process.exit(1);
              }
              let body;
              try {
                body = await response.json();
              } catch {
                console.error('::error::Artifact listing returned invalid JSON.');
                process.exit(1);
              }
              if (!body || !Array.isArray(body.artifacts) || !Number.isInteger(body.total_count)) {
                console.error('::error::Artifact listing has an unexpected shape.');
                process.exit(1);
              }
              if (totalCount === null) {
                totalCount = body.total_count;
                if (totalCount > maxArtifacts) {
                  console.error('::error::Artifact listing exceeds the bounded artifact limit.');
                  process.exit(1);
                }
              }
              for (const artifact of body.artifacts) {
                if (!artifact || !Number.isInteger(artifact.id) || typeof artifact.name !== 'string') {
                  console.error('::error::Artifact listing contains an invalid entry.');
                  process.exit(1);
                }
                artifacts.push({
                  id: artifact.id,
                  name: artifact.name,
                  sizeInBytes: Number.isInteger(artifact.size_in_bytes) ? artifact.size_in_bytes : null,
                  expired: artifact.expired === true,
                });
              }
              if (artifacts.length >= totalCount) break;
            }
            if (totalCount === null || artifacts.length !== totalCount) {
              console.error('::error::Artifact listing did not complete; refusing to publish incomplete evidence.');
              process.exit(1);
            }
            if (new Set(artifacts.map((artifact) => artifact.id)).size !== artifacts.length) {
              console.error('::error::Artifact listing contains duplicate artifact ids.');
              process.exit(1);
            }

            fs.mkdirSync(path.dirname(outputPath), { recursive: true });
            fs.writeFileSync(
              outputPath,
              JSON.stringify(
                {
                  version: 1,
                  runId,
                  repository: repo,
                  complete: true,
                  artifactCount: artifacts.length,
                  artifacts,
                },
                null,
                2,
              ) + '\n',
            );
            console.log(`opencode-review: listed ${artifacts.length} artifact(s)`);
          }

          main().catch(() => {
            console.error('::error::Artifact listing failed.');
            process.exit(1);
          });
          NODE

      # v8 download-artifact treats a pattern with zero matches as success, so a
      # zero-batch run still reaches the publisher instead of failing here.
      - name: Download bounded review outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: review-outcome-*
          path: ${{ runner.temp }}/review-outcomes
          merge-multiple: false

      - name: Publish or update one aggregate review comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/review-input/trusted/review-publish.mjs" \
            --manifest "$RUNNER_TEMP/review-input/manifest.json" \
            --artifacts "$RUNNER_TEMP/review-artifacts/artifacts.json" \
            --outcomes "$RUNNER_TEMP/review-outcomes" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --aggregate "$RUNNER_TEMP/review-aggregate/aggregate.json" \
            --markdown "$RUNNER_TEMP/review-aggregate/review.md"

      - name: Upload aggregate review report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-aggregate
          path: ${{ runner.temp }}/review-aggregate
          if-no-files-found: warn
          retention-days: 3
